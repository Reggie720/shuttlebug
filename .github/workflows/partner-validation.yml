name: Partner validation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
      - run: node tests/partner.cjs
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
